name: Deploy sitio a GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        run: |
          mkdir -p public
          cp dashboard_portafolio_ti_2026.html public/index.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
